spring.application.name=PaymentService

server.port=${SERVER_PORT:8080}

spring.mvc.problemdetails.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# PostgreSQL / JPA / Flyway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.01:5432/payment_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:payment}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:49092}

# Kafka consumer
spring.kafka.consumer.group-id=${PAYMENT_SERVICE_CONSUMER_GROUP:payment-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.wfortini.paymentservice.infrastructure.adapter.in.messaging.ChangedPaymentOrderMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.wfortini.paymentservice.infrastructure.adapter.in.messaging
spring.kafka.consumer.properties.spring.json.use.type.headers=false
payment.kafka.payment-order-event-topic=${PAYMENT_ORDER_EVENT_TOPIC:payment-orders-event}

# Kafka producer
spring.kafka.template.default-topic=${PAYMENT_EVENT_TOPIC:payment-events}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
payment.kafka.payment-event-topic=${PAYMENT_EVENT_TOPIC:payment-events}
payment.kafka.payment-processed-topic=${PAYMENT_PROCESSED_TOPIC:payment_processed}

# Observability
management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=payment-service

#Micrometer Tracing will only send 10% of the traces it generates to Tempo, \
# just to avoid overwhelming it with a lot of requests.
# We can set it to 100% by adding the below
management.tracing.sampling.probability=1.0
