spring.datasource.url=jdbc:h2:mem:payment_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service-test
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.wfortini.paymentservice.infrastructure.adapter.in.messaging.ChangedPaymentOrderMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.wfortini.paymentservice.infrastructure.adapter.in.messaging
spring.kafka.consumer.properties.spring.json.use.type.headers=false
payment.kafka.payment-order-event-topic=payment-orders-event
