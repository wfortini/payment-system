spring.application.name=PaymentExecutor
server.port=${SERVER_PORT:8080}

# MongoDB
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/executordb}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=true

# Kafka consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:49092}
spring.kafka.consumer.group-id=${PAYMENT_EXECUTOR_CONSUMER_GROUP:payment-executor}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.wfortini.paymentexecutor.infrastructure.adapter.in.kafka.PaymentEventMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.wfortini.paymentexecutor.infrastructure.adapter.in.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
payment.kafka.payment-event-topic=${PAYMENT_EVENT_TOPIC:payment-events}

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
payment.kafka.payment-order-event-topic=${PAYMENT_ORDER_EVENT_TOPIC:payment-orders-event}

# PSP
payment.psp.base-url=${PSP_BASE_URL:http://localhost:8082}
