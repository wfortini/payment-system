services:
  postgres:
    image: postgres:17-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  payment-service:
    image: payment-service:0.0.1-SNAPSHOT
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_service
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - payment-kafka-network
    restart: unless-stopped

  ledger-service:
    image: ledger-service:0.0.1-SNAPSHOT
    container_name: ledger-service
    environment:
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    restart: unless-stopped

  psp-emulator:
    image: psp-emulator:0.0.1-SNAPSHOT
    container_name: psp-emulator
    environment:
      SERVER_PORT: 8080
      PSP_DATABASE_PATH: /data/psp-emulator
      PSP_NOTIFICATION_BASE_URL: ${PSP_NOTIFICATION_BASE_URL:-http://host.docker.internal:8089}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8080"
    volumes:
      - psp-emulator-data:/data
    restart: unless-stopped

  mongo:
    image: mongo:8.0.4
    container_name: payment-executor-mongo
    environment:
      MONGO_INITDB_DATABASE: executordb
    ports:
      - "27017:27017"
    volumes:
      - payment-executor-mongo-data:/data/db
      - ./PaymentExecutor/docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  payment-executor:
    image: payment-executor:0.0.1-SNAPSHOT
    container_name: payment-executor
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/executordb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      PAYMENT_EVENT_TOPIC: payment-events
      PAYMENT_EXECUTOR_CONSUMER_GROUP: payment-executor
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - payment-kafka-network
    restart: unless-stopped
  loki:
    image: grafana/loki:main
    container_name: loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.2.2
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./data/tempo:/tmp/tempo
    ports:
      - "3110:3200" # Tempo HTTP API
      - "9411:9411" # Zipkin receiver
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  payment-postgres-data:
  payment-executor-mongo-data:
  psp-emulator-data:

networks:
  payment-kafka-network:
    external: true
